<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Interior with building materials and finishes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D3748"/>
      <stop offset="0.55" stop-color="#3A4657"/>
      <stop offset="1" stop-color="#1E1B1C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BA0F4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#507EEF" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="none"/>
      <path d="M0 0h120v120H0z" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#tiles)"/>
  <!-- window with light -->
  <g opacity="0.9">
    <rect x="1020" y="120" width="430" height="520" rx="6" fill="url(#glass)"/>
    <rect x="1020" y="120" width="430" height="520" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
    <path d="M1235 120v520M1020 380h430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  </g>
  <!-- door -->
  <g opacity="0.85">
    <rect x="300" y="230" width="210" height="560" rx="6" fill="#1E1B1C" fill-opacity="0.55"/>
    <rect x="300" y="230" width="210" height="560" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4"/>
    <circle cx="470" cy="520" r="9" fill="#507EEF"/>
  </g>
  <!-- ceiling lines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="3">
    <path d="M0 90h1600M0 150h1600"/>
  </g>
  <!-- floor plane -->
  <path d="M0 790h1600v110H0z" fill="#000000" fill-opacity="0.25"/>
</svg>
